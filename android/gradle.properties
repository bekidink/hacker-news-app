# Project-wide Gradle settings
android.useAndroidX=true
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false

# Memory Settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# React Native Architecture
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# --- JAVA TOOLCHAIN FIXES ---
# 1. Point to the specific JDK
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# 2. Tell Gradle where to find local Java installations
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr

# 3. Disable auto-searching to prevent the IBM_SEMERU crash
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# 4. Enable management so it respects the path we provided above
org.gradle.toolchain.management.enabled=true